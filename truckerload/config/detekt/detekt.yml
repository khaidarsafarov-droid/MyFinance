build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
      - PreviewLightDark
      - PreviewFontScale
      - PreviewScreenSizes
  LongMethod:
    active: true
    ignoreAnnotated:
      - Preview
      - PreviewLightDark
      - PreviewFontScale
      - PreviewScreenSizes
  LongParameterList:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
      - PreviewLightDark
      - PreviewFontScale
      - PreviewScreenSizes
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
      - PreviewLightDark
      - PreviewFontScale
      - PreviewScreenSizes
      - PreviewParameter

style:
  MagicNumber:
    active: true
    ignoreAnnotated:
      - Preview
      - PreviewLightDark
      - PreviewFontScale
      - PreviewScreenSizes
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - Preview
      - PreviewLightDark
      - PreviewFontScale
      - PreviewScreenSizes
      - Composable
  ReturnCount:
    active: true
    ignoreAnnotated:
      - Composable
      - Preview
      - PreviewLightDark
