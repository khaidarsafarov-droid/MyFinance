<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TruckoRig Play screenshots</title>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("../assets/dm_sans_regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("../assets/dm_sans_medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("../assets/dm_sans_semibold.ttf") format("truetype");
      font-weight: 600;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("../assets/dm_sans_bold.ttf") format("truetype");
      font-weight: 700;
    }

    :root {
      --kit: #5B54E6;
      --kit-deep: #3F3AB8;
      --lavender: #A29BFE;
      --soft: #D4D0FF;
      --sage: #EEEDFF;
      --sage-hover: #E0DEFF;
      --border: #E8E7F4;
      --border-strong: #C4C1E0;
      --bg: #F8F9FE;
      --shell: #F0F1FA;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --muted: #5C5C5C;
      --success: #1A7A68;
      --success-bg: #D4F5EE;
      --warning: #9A6400;
      --danger: #C4395A;
      --teal: #48C9B0;
      --orange: #FFB74D;
      --pink: #FF708D;
      --dark: #16141F;
      --dark-surface: #1E1B2C;
      --radius-card: 24px;
      --radius-btn: 16px;
      --font: "DM Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(ellipse at 20% 0%, #7a74f0 0%, transparent 55%),
        radial-gradient(ellipse at 100% 80%, #2a2460 0%, transparent 50%),
        linear-gradient(165deg, #5B54E6 0%, #3F3AB8 42%, #16141F 100%);
    }
    .canvas.tablet {
      width: 1920px;
      height: 1200px;
      background:
        radial-gradient(ellipse at 10% 0%, #7a74f0 0%, transparent 50%),
        linear-gradient(120deg, #5B54E6 0%, #2a2460 55%, #16141F 100%);
    }
    .canvas.feature {
      width: 1024px;
      height: 500px;
      background:
        radial-gradient(ellipse at 0% 50%, #8a85f5 0%, transparent 55%),
        linear-gradient(105deg, #5B54E6 0%, #3F3AB8 45%, #16141F 100%);
    }

    .caption {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 64px;
      color: #fff;
      text-align: center;
      z-index: 2;
    }
    .caption h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .caption p {
      margin: 18px 0 0;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 500;
      color: var(--soft);
    }
    .canvas.tablet .caption {
      left: 64px;
      right: auto;
      top: 72px;
      width: 520px;
      text-align: left;
    }
    .canvas.tablet .caption h1 { font-size: 52px; }
    .canvas.tablet .caption p { font-size: 24px; }

    .device {
      position: absolute;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      width: 720px;
      height: 1488px;
      background: #1E1B2C;
      border-radius: 56px;
      padding: 14px;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.35),
        0 0 0 2px rgba(255, 255, 255, 0.08);
    }
    .device::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 18px;
      background: #0d0b14;
      border-radius: 12px;
      z-index: 4;
    }
    .canvas.tablet .device {
      left: auto;
      right: 48px;
      bottom: 48px;
      transform: none;
      width: 1240px;
      height: 860px;
      border-radius: 36px;
      padding: 12px;
    }
    .canvas.tablet .device::before {
      width: 10px;
      height: 10px;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      border-radius: 50%;
    }

    .phone {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      color: var(--text);
    }
    .canvas.tablet .phone { border-radius: 26px; }

    .status {
      height: 42px;
      padding: 10px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
      background: var(--sage);
    }
    .status .dots { letter-spacing: 2px; color: var(--kit); }

    .hdr {
      background: var(--sage);
      padding: 4px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid #D4D2E8;
    }
    .hdr .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .hdr h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .hdr .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
    .ico-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: grid; place-items: center;
      color: var(--kit);
      flex-shrink: 0;
    }

    .body {
      flex: 1;
      overflow: hidden;
      padding: 16px 18px 96px;
      background: var(--bg);
    }
    .canvas.tablet .body { padding: 16px 18px; display: flex; gap: 16px; }

    .hero {
      background: linear-gradient(160deg, #5B54E6 0%, #3F3AB8 100%);
      color: #fff;
      border-radius: var(--radius-card);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(91, 84, 230, 0.35);
    }
    .hero .kicker {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 8px;
    }
    .hero .amt { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .hero .meta { margin-top: 6px; font-size: 15px; color: var(--soft); font-weight: 500; }
    .week-dots {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }
    .week-dots span {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }
    .week-dots i {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      display: block;
    }
    .week-dots i.on { background: #fff; }
    .week-dots i.past { background: rgba(255,255,255,0.85); }

    .btn {
      width: 100%;
      border: 0;
      background: var(--kit);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 16px;
      padding: 14px;
      border-radius: var(--radius-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 16px;
      box-shadow: 0 6px 16px rgba(91, 84, 230, 0.35);
    }
    .btn.ghost {
      background: var(--surface);
      color: var(--kit);
      border: 1px solid var(--border);
      box-shadow: none;
      margin-bottom: 10px;
    }

    .section {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(91, 84, 230, 0.06);
    }
    .card .row { display: flex; justify-content: space-between; align-items: baseline; }
    .card .id { font-weight: 700; font-size: 16px; }
    .card .date { font-size: 13px; color: var(--muted); font-weight: 500; }
    .card .route { font-weight: 700; font-size: 14px; margin: 6px 0 8px; }
    .card .stats { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .card .stats b { color: var(--text); }
    .rpm {
      display: inline-block;
      margin-top: 10px;
      background: var(--success-bg);
      color: var(--success);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .rpm.warn { background: #FFF3D6; color: var(--warning); }

    .nav {
      position: absolute;
      left: 16px; right: 16px; bottom: 14px;
      height: 64px;
      background: var(--surface);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 8px;
      z-index: 5;
    }
    .nav button {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      color: rgba(26,26,26,0.72);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
    }
    .nav button.active {
      background: var(--text);
      color: #fff;
    }
    .nav svg { width: 22px; height: 22px; fill: currentColor; }

    .ring-wrap { display: grid; place-items: center; margin: 8px 0 12px; }
    .ring {
      width: 168px; height: 168px;
      border-radius: 50%;
      background: conic-gradient(#48C9B0 0 72%, rgba(255,255,255,0.18) 72% 100%);
      display: grid; place-items: center;
    }
    .ring-inner {
      width: 128px; height: 128px;
      border-radius: 50%;
      background: #3F3AB8;
      display: grid; place-items: center;
      text-align: center;
      color: #fff;
    }
    .ring-inner .pct { font-size: 32px; font-weight: 700; }
    .ring-inner .lbl { font-size: 12px; color: var(--soft); }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px;
    }
    .tile .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field .box, .field textarea, .field input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-btn);
      padding: 12px 14px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
    }
    .field textarea { min-height: 132px; line-height: 1.45; resize: none; }
    .chips { display: flex; gap: 8px; margin-bottom: 12px; }
    .chip {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .chip.on { background: var(--kit); color: #fff; border-color: var(--kit); }

    .preview {
      background: var(--sage);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .preview b { display: block; font-size: 18px; margin-bottom: 4px; }

    .list {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 500;
    }
    .list .mark {
      width: 36px; height: 36px;
      border-radius: 12px;
      background: var(--sage);
      color: var(--kit);
      display: grid; place-items: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .list .chev { margin-left: auto; color: var(--muted); }
    .list .ok { color: var(--success); font-size: 12px; font-weight: 700; }

    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--kit);
      color: #fff;
      display: grid; place-items: center;
      font-size: 28px;
      font-weight: 700;
      margin: 4px auto 10px;
    }
    .pname { text-align: center; font-size: 22px; font-weight: 700; margin: 0; }
    .pmeta { text-align: center; font-size: 14px; color: var(--muted); margin: 4px 0 16px; }

    .login-hero { text-align: center; padding: 36px 8px 20px; }
    .login-hero img {
      width: 96px; height: 96px;
      border-radius: 24px;
      display: block;
      margin: 0 auto 16px;
    }
    .login-hero h3 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .login-hero p { color: var(--muted); font-size: 15px; margin: 8px 0 0; }

    .gbtn {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: var(--radius-btn);
      padding: 14px;
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .chart {
      height: 88px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 4px 0;
    }
    .chart i {
      flex: 1;
      border-radius: 8px 8px 4px 4px;
      background: var(--kit);
      display: block;
    }
    .chart i.alt { background: var(--teal); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      color: var(--success);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .rail {
      width: 88px;
      flex-shrink: 0;
      background: var(--sage);
      border-right: 1px solid #D4D2E8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
      gap: 12px;
    }
    .rail .rbtn {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: grid; place-items: center;
      color: var(--muted);
    }
    .rail .rbtn.on { background: var(--text); color: #fff; }
    .tablet-main { display: flex; flex: 1; min-width: 0; }
    .tablet-col { flex: 1; min-width: 0; padding: 8px 12px; }
    .tablet-col.side { max-width: 340px; }

    .feature-inner {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 48px 56px;
      gap: 36px;
      color: #fff;
    }
    .feature-inner img {
      width: 220px;
      height: 220px;
      border-radius: 48px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.28);
      flex-shrink: 0;
    }
    .feature-inner h1 {
      margin: 0;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .feature-inner p {
      margin: 12px 0 0;
      font-size: 26px;
      font-weight: 500;
      color: var(--soft);
      max-width: 560px;
      line-height: 1.3;
    }

    .hidden { display: none !important; }
  </style>
</head>

    const params = new URLSearchParams(location.search);

    function statusBar() {
      return `<div class="status"><span>9:41</span><span class="dots">●●●&nbsp;&nbsp;▮</span></div>`;
    }
    function hdr(title, sub, back = false) {
      return `<header class="hdr">
        <div class="left">
          <div class="ico-btn">${back ? ICO.back : ICO.menu}</div>
          <div><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}</div>
        </div>
        ${back ? "" : `<div class="ico-btn">${ICO.search}</div>`}
      </header>`;
    }
    function nav(active) {
      const item = (id, icon, label) =>
        `<button class="${id === active ? "active" : ""}">${icon}<span>${id === active ? label : ""}</span></button>`;
      return `<nav class="nav">
        ${item("home", ICO.truck, t.navLoads)}
        ${item("goal", ICO.flag, t.navGoal)}
        ${item("profile", ICO.person, t.navProfile)}
      </nav>`;
    }
    function weekDots() {
      const days = ["S","M","T","W","T","F","S"];
      const today = 3; // Wednesday for a stable store shot
      return `<div class="week-dots">${days.map((d, i) => {
        const cls = i + 1 === today ? "on" : (i + 1 < today ? "past" : "");
        return `<span>${d}<i class="${cls}"></i></span>`;
      }).join("")}</div>`;
    }

      return `<div class="canvas">

                  <div class="row"><span class="id">T-116KYL6KW</span><span class="date">19 Jul</span></div>

                <div class="meta">4,617 mi · $2.67 / mi</div>

              <div class="grid2">
                <div class="tile"><div class="k">${t.loads}</div><div class="v">4</div></div>
                <div class="tile"><div class="k">RPM</div><div class="v">$2.67</div></div>

            </div>
          </div>

    function featureCanvas() {
      return `<div class="canvas feature">
        <div class="feature-inner">
          <img src="../assets/ic_launcher_image.png" alt="TruckoRig" />
          <div>
            <h1>TruckoRig</h1>
            <p>${t.featureP}</p>
          </div>
        </div>
      </div>`;
    }

    const root = document.getElementById("root");
    if (kind === "feature") root.innerHTML = featureCanvas();
    else if (kind === "tablet") root.innerHTML = tabletCanvas();
    else root.innerHTML = phoneCanvas(slide in SCREENS ? slide : "journal");
    const canvas = document.querySelector(".canvas");
    if (canvas) {
      const w = getComputedStyle(canvas).width;
      const h = getComputedStyle(canvas).height;
      document.body.style.margin = "0";
      document.body.style.width = w;
      document.body.style.height = h;
      document.body.style.overflow = "hidden";
      document.documentElement.style.overflow = "hidden";
    }
  </script>
