# Production LiveKit on a DigitalOcean Droplet (audio-only).
# Copy to /etc/livekit/livekit.yaml and replace REPLACE_* keys.
# Do not commit real API keys.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  node_ip: REPLACE_PUBLIC_IPV4
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302
keys:
  REPLACE_API_KEY: REPLACE_API_SECRET
room:
  auto_create: true
  empty_timeout: 300
  enabled_codecs:
    - mime: audio/opus
logging:
  level: info
