name: TruckerLoad CI

on:
  pull_request:
    paths:
      - "truckerload/**"
      - ".github/workflows/truckerload-ci.yml"
  push:
    branches: [main]
    paths:
      - "truckerload/**"
      - ".github/workflows/truckerload-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truckerload-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: truckerload
    shell: bash

jobs:
  contract-tests:
    name: Shared KMP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :shared:jvmTest :shared:contract:jvmTest :shared:domain:jvmTest --no-daemon
      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-kmp-test-reports
          path: |
            truckerload/shared/build/reports/tests/
            truckerload/shared/build/test-results/
            truckerload/shared/contract/build/reports/tests/
            truckerload/shared/contract/build/test-results/
            truckerload/shared/domain/build/reports/tests/
            truckerload/shared/domain/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --no-daemon
      - name: Kotlin file-size gate (600 LOC soft limit)
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:checkKotlinFileSize --no-daemon
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            truckerload/app/build/reports/tests/
            truckerload/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: |
          set -euo pipefail
          args=(-Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --no-daemon)
          log="$(mktemp)"
          if sh ./gradlew "${args[@]}" 2>&1 | tee "$log"; then
            exit 0
          fi
          if ! grep -q "org.jetbrains.kotlin.plugin.compose" "$log"; then
            exit 1
          fi
          echo "Compose plugin lookup failed on a cold Gradle cache; retrying once."
          sleep 15
          sh ./gradlew "${args[@]}" --refresh-dependencies
      - name: Verify release BuildConfig has no bot/API secrets
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:verifyReleaseSecretsEmpty --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: truckerload-debug-apk
          path: truckerload/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:lintDebug --no-daemon

  android-release:
    name: Assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Owner: add a repository Actions secret named MAPS_API_KEY (Settings →
      # Secrets and variables → Actions). A blank secret keeps the placeholder in
      # truckerload/local.defaults.properties. bundleRelease reads the same variable.
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleRelease --no-daemon
