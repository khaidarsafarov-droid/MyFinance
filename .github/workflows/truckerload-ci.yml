name: TruckerLoad CI

on:
  pull_request:
    paths:
      - "truckerload/**"
      - ".github/workflows/truckerload-ci.yml"
  push:
    branches: [main]
    paths:
      - "truckerload/**"
      - ".github/workflows/truckerload-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truckerload-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: truckerload
    shell: bash

jobs:
  contract-tests:
    name: Shared KMP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :shared:jvmTest :shared:contract:jvmTest :shared:domain:jvmTest --no-daemon
      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-kmp-test-reports
          path: |
            truckerload/shared/build/reports/tests/
            truckerload/shared/build/test-results/
            truckerload/shared/contract/build/reports/tests/
            truckerload/shared/contract/build/test-results/
            truckerload/shared/domain/build/reports/tests/
            truckerload/shared/domain/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --no-daemon
      - name: Kotlin file-size gate (600 LOC soft limit)
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:checkKotlinFileSize --no-daemon
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            truckerload/app/build/reports/tests/
            truckerload/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --no-daemon
      - name: Verify release BuildConfig has no bot/API secrets
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:verifyReleaseSecretsEmpty --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: truckerload-debug-apk
          path: truckerload/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
