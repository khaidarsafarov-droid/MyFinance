name: Deploy TruckerLoad to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      registry_name:
        description: DigitalOcean Container Registry name
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: truckerload-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: truckerload
    shell: bash

jobs:
  deploy:
    name: Publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify backend and contracts
        run: sh ./gradlew :shared:contract:test :backend:server:test --no-daemon
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Validate registry name
        env:
          REGISTRY_NAME: ${{ inputs.registry_name }}
        run: |
          if [[ ! "$REGISTRY_NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "registry_name must contain only lowercase letters, digits, and hyphens" >&2
            exit 2
          fi
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Build and publish immutable and production tags
        env:
          REGISTRY_NAME: ${{ inputs.registry_name }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          image="registry.digitalocean.com/${REGISTRY_NAME}/truckerload-backend"
          docker build --file backend/server/Dockerfile --tag "${image}:${IMAGE_SHA}" .
          docker push "${image}:${IMAGE_SHA}"
          docker tag "${image}:${IMAGE_SHA}" "${image}:production"
          docker push "${image}:production"
      - name: Log out of DigitalOcean Container Registry
        if: always()
        run: doctl registry logout
