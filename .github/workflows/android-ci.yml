name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: truckerload
    shell: bash

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run debug unit tests
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --no-daemon
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-reports
          path: |
            truckerload/app/build/reports/tests/
            truckerload/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  shared-tests:
    name: Shared JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared JVM tests
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :shared:jvmTest --no-daemon
      - name: Upload shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-jvm-test-reports
          path: |
            truckerload/shared/build/reports/tests/
            truckerload/shared/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  file-size:
    name: Kotlin file size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Kotlin file size
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:checkKotlinFileSize --no-daemon

  lint:
    name: Lint debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run debug lint
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:lintDebug --no-daemon
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-debug-reports
          path: |
            truckerload/app/build/reports/lint-results-debug.html
            truckerload/app/build/reports/lint-results-debug.xml
            truckerload/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

  assemble-debug:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: sh ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --no-daemon
